name: Publish Lambda image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: duckdb
        run: echo "version=$(node scripts/duckdb-version.js)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rhumbclub/malloy-publisher-lambda:${{ github.sha }}
          build-args: |
            DUCKDB_VERSION=${{ steps.duckdb.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
